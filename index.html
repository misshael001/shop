<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--tx:#fff;--tx2:#8e8e93;--ac:#0a84ff;--red:#ff453a;--grn:#30d158;--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.view{display:none;padding:0 16px}.view.on{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px;padding:14px 0 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:40px;margin-bottom:12px;transition:background .25s}
.search:focus-within{background:var(--card2)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;min-width:0}
.search span{color:var(--tx2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:20px;background:var(--card);color:var(--tx2);font-size:15px;transition:all .3s var(--ease)}
.chip.on{background:var(--ac);color:#fff}
.chip:active{transform:scale(.94)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:20px;overflow:hidden;position:relative;transition:transform .25s var(--ease);animation:fade .5s var(--ease) both}
.card:active{transform:scale(.965)}
.pic{height:118px;display:grid;place-items:center;font-size:58px}
.info{padding:10px 12px 12px}
.info b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--tx2);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-weight:600}
.add{width:30px;height:30px;border-radius:50%;background:var(--ac);font-size:20px;line-height:30px;text-align:center;transition:transform .2s var(--ease)}
.add:active{transform:scale(.8)}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);font-size:15px;transition:transform .25s var(--ease)}
.fav:active{transform:scale(.75)}
.empty{text-align:center;color:var(--tx2);padding:60px 20px}.empty i{font-style:normal;font-size:56px;display:block;margin-bottom:10px}
.list{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--line);animation:fade .35s var(--ease)}
.item:last-child{border:0}
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:500}.item .t small{color:var(--tx2)}
.step{display:flex;align-items:center;background:var(--card2);border-radius:10px}
.step button{width:32px;height:30px;font-size:18px;color:var(--ac)}
.step span{min-width:22px;text-align:center;font-weight:600}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:4px 4px 14px}
.btn{display:block;width:100%;background:var(--ac);color:#fff;font-weight:600;border-radius:14px;padding:15px;text-align:center;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.ghost{background:var(--card2);color:var(--ac)}
.btn.red{background:var(--card);color:var(--red)}
.ava{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#5e5ce6,#0a84ff);display:grid;place-items:center;font-size:36px;font-weight:600;margin:10px auto 10px}
.center{text-align:center;margin-bottom:18px}.center small{color:var(--tx2)}
.kv{display:flex;justify-content:space-between;padding:13px 14px;border-bottom:.5px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--tx2)}
.h2{color:var(--tx2);font-size:13px;margin:0 0 6px 14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(28,28,30,.78);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:.5px solid var(--line);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2);position:relative;transition:color .25s,transform .2s var(--ease)}
.tab i{font-style:normal;font-size:23px;transition:transform .3s var(--ease)}
.tab.on{color:var(--ac)}.tab.on i{transform:scale(1.12)}.tab:active{transform:scale(.9)}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .3s var(--ease)}
.badge.on{transform:scale(1)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease);z-index:31;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.big{height:170px;border-radius:20px;display:grid;place-items:center;font-size:96px;margin-bottom:14px}
.sheet h2{font-size:24px;letter-spacing:-.3px}.sheet p{color:var(--tx2);margin:6px 0 16px}
.field{display:block;margin-bottom:10px}
.field input{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;color:var(--tx);font:inherit;outline:0;transition:border-color .25s}
.field input:focus{border-color:var(--ac)}.field input.err{border-color:var(--red)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:rgba(44,44,46,.92);backdrop-filter:blur(20px);padding:11px 18px;border-radius:22px;font-size:15px;z-index:50;transition:transform .5s var(--ease);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#5e5ce6,#0a84ff 60%,#64d2ff);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.banner b{display:block;font-size:20px;letter-spacing:-.3px}.banner small{opacity:.85;font-size:13px}.banner span{font-size:40px}
.srt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.srt small{color:var(--tx2)}.srt button{color:var(--ac);font-size:15px}
.tag{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;z-index:1}
.tag.no{background:rgba(72,72,74,.9)}.tag.lo{background:#ff9f0a}
.card.out .pic{opacity:.35;filter:grayscale(.6)}.card.out .info{opacity:.55}
.old{color:var(--tx2);font-weight:400;font-size:12px;text-decoration:line-through;margin-left:6px}
.stock{color:var(--grn);font-weight:500;margin-bottom:14px}.stock.no,small.no{color:var(--red)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;margin-bottom:10px}.seg button{flex:1;padding:8px;border-radius:8px;transition:background .3s var(--ease)}.seg .on{background:#636366}
.pr{display:flex;gap:8px;margin-bottom:12px;align-items:stretch}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .kv{padding:10px 2px}#v-admin .item{animation:none}#v-admin [data-e]{cursor:pointer}
.pic img,.big img,.thumb img{width:100%;height:100%;object-fit:cover;display:block}.big,.thumb{overflow:hidden}
.photo{display:flex;gap:10px;align-items:center;margin-bottom:10px}.photo .thumb{width:64px;height:64px;font-size:34px;flex:none}.photo .btn{flex:1;padding:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<section class="view on" id="v-catalog">
  <h1>Каталог</h1>
  <div class="banner"><div><b>Бесплатная доставка</b><small>При заказе от 300 lei</small></div><span>🚚</span></div>
  <label class="search"><span>🔍</span><input id="q" placeholder="Поиск товаров" autocomplete="off"></label>
  <div class="chips" id="chips"></div><div class="srt"><small id="cnt"></small><button id="so"></button></div>
  <div class="grid" id="grid"></div>
</section>
<section class="view" id="v-cart"><h1>Корзина</h1><div id="cart"></div></section>
<section class="view" id="v-profile"><h1>Профиль</h1><div id="profile"></div><button class="btn" id="adm" style="margin-top:14px;background:none;color:var(--tx2);font-size:14px">Вход для владельца</button></section>
<section class="view" id="v-admin"></section>

<nav class="tabbar">
  <button class="tab on" data-t="catalog"><i>🛍️</i>Каталог</button>
  <button class="tab" data-t="cart"><i>🧺</i>Корзина<b class="badge" id="badge">0</b></button>
  <button class="tab" data-t="profile"><i>👤</i>Профиль</button>
</nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const DEF=[
{id:1,n:'Наушники Air',c:'Электроника',p:12990,e:'🎧',g:['#5e5ce6','#0a84ff'],d:'Беспроводные наушники с шумоподавлением и 30 часами работы.'},
{id:2,n:'Смарт-часы S',c:'Электроника',p:18490,e:'⌚',g:['#ff9f0a','#ff453a'],d:'Пульс, сон, GPS и экран, который читается на солнце.'},
{id:3,n:'Колонка Mini',c:'Электроника',p:5990,e:'🔊',g:['#30d158','#0a84ff'],d:'Компактная колонка с насыщенным басом и защитой от воды.'},
{id:4,n:'Клавиатура',c:'Электроника',p:7490,e:'⌨️',g:['#64d2ff','#5e5ce6'],d:'Механическая клавиатура с тихими переключателями.'},
{id:5,n:'Худи Classic',c:'Одежда',p:4990,e:'🧥',g:['#bf5af2','#5e5ce6'],d:'Плотный хлопок, свободный крой, капюшон со шнуровкой.'},
{id:6,n:'Кроссовки Run',c:'Одежда',p:9990,e:'👟',g:['#ff453a','#ff9f0a'],d:'Лёгкие кроссовки для города и пробежек.'},
{id:7,n:'Кепка',c:'Одежда',p:1990,e:'🧢',g:['#0a84ff','#64d2ff'],d:'Хлопковая кепка с регулируемым ремешком.'},
{id:8,n:'Рюкзак City',c:'Аксессуары',p:6490,e:'🎒',g:['#ffd60a','#ff9f0a'],d:'Отделение для ноутбука 15″, водоотталкивающая ткань.'},
{id:9,n:'Очки Sun',c:'Аксессуары',p:3490,e:'🕶️',g:['#8e8e93','#48484a'],d:'Поляризационные линзы, защита UV400.'},
{id:10,n:'Кофе в зёрнах',c:'Еда',p:1190,e:'☕',g:['#a2845e','#6e5434'],d:'Арабика, средняя обжарка, 1 кг.'},
{id:11,n:'Чай матча',c:'Еда',p:890,e:'🍵',g:['#30d158','#248a3d'],d:'Церемониальная матча из Японии, 50 г.'},
{id:12,n:'Шоколад 72%',c:'Еда',p:390,e:'🍫',g:['#8b5a3c','#4a2f1d'],d:'Тёмный шоколад ручной работы.'}];
const getCats=()=>['Все',...new Set(P.map(x=>x.c))];
let S={cart:{},fav:[],user:null,orders:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('shop')||'{}'))}catch(e){}
let P=(S.v===3&&S.products)||(S.orders=[],S.cart={},[]);
const save=()=>{try{S.v=3;S.products=P;localStorage.setItem('shop',JSON.stringify(S))}catch(e){toast('Не удалось сохранить: мало места')}};
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}}
const hap=t=>{try{tg&&tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rub=n=>n.toLocaleString('ru-RU')+' '+CF().cur;
const grad=g=>`background:linear-gradient(135deg,${g[0]},${g[1]})`;
let cat='Все',q='',tab='catalog',sort=0;const SORTS=[['','Популярные'],['asc','Сначала дешевле'],['desc','Сначала дороже']];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('on');$('#ov').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeSheet;

function go(t){tab=t;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='cart')renderCart();if(t==='profile')renderProfile();if(t==='admin')renderAdmin();if(t==='catalog'){renderChips();renderGrid();loadCatalog()}scrollTo({top:0});hap()}
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));

function count(){return Object.values(S.cart).reduce((a,b)=>a+b,0)}
function badge(){const n=count(),b=$('#badge');b.textContent=n;b.classList.toggle('on',n>0)}
function add(id,d){const x=P.find(p=>p.id===id);if(!x)return false;const n=(S.cart[id]||0)+d;if(d>0&&n>x.s){toast(x.s<1?'Нет в наличии':'Больше нет в наличии');hap('heavy');return false}if(n<=0)delete S.cart[id];else S.cart[id]=n;save();badge();if(tab==='cart')renderCart();return true}

function renderChips(){if(!getCats().includes(cat))cat='Все';$('#chips').innerHTML=getCats().map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
  $$('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;hap();renderChips();renderGrid()})}
function renderGrid(){
  let l=P.filter(x=>(cat==='Все'||x.c===cat)&&x.n.toLowerCase().includes(q.toLowerCase().trim()));l.sort((a,b)=>(b.s>0)-(a.s>0));const sk=SORTS[sort][0];if(sk==='asc')l.sort((a,b)=>a.p-b.p);if(sk==='desc')l.sort((a,b)=>b.p-a.p);$('#cnt').textContent='Найдено: '+l.length;$('#so').textContent='⇅ '+SORTS[sort][1];
  $('#grid').innerHTML=l.length?l.map((x,i)=>`<div class="card ${x.s<1?'out':''}" style="animation-delay:${i*35}ms" data-id="${x.id}">
    <div class="pic" style="${grad(x.g)}">${ic(x)}</div>${tag(x)}
    <button class="fav" data-f="${x.id}">${S.fav.includes(x.id)?'❤️':'🤍'}</button>
    <div class="info"><b>${x.n}</b><small>${x.c}</small><div class="row"><span class="price">${rub(x.p)}</span>${x.s<1?'':`<button class="add" data-a="${x.id}">+</button>`}</div></div></div>`).join('')
    :'<div class="empty" style="grid-column:1/-1"><i>🔎</i>'+(P.length?'Ничего не найдено.<br>Попробуйте другой запрос.':'Каталог пока пуст.<br>Скоро здесь появятся товары.')+'</div>';
  $$('.card').forEach(c=>c.onclick=e=>{
    const a=e.target.closest('[data-a]'),f=e.target.closest('[data-f]');
    if(a){if(add(+a.dataset.a,1)){hap();toast('Добавлено в корзину')}}
    else if(f){const id=+f.dataset.f,i=S.fav.indexOf(id);i>-1?S.fav.splice(i,1):S.fav.push(id);save();f.textContent=i>-1?'🤍':'❤️';hap()}
    else product(+c.dataset.id)})}
$('#q').oninput=e=>{q=e.target.value;renderGrid()};

function product(id){const x=P.find(p=>p.id===id);
  openSheet(`<div class="big" style="${grad(x.g)}">${ic(x)}</div><h2>${x.n}</h2><p>${x.d}</p><div class="stock ${x.s<1?'no':''}">${x.s<1?'Нет в наличии':x.s<4?'Осталось '+x.s+' шт.':'В наличии'}</div>
  <button class="btn" id="pb" ${x.s<1?'disabled style="opacity:.4"':''}>${x.s<1?'Нет в наличии':'В корзину · '+rub(x.p)}</button>`);
  $('#pb').onclick=()=>{if(add(id,1)){closeSheet();toast('Добавлено в корзину')}hap('medium')}}

function renderCart(){const ids=Object.keys(S.cart).map(Number).filter(id=>P.find(p=>p.id===id));
  if(!ids.length){$('#cart').innerHTML='<div class="empty"><i>🧺</i>Корзина пуста.<br>Выберите что-нибудь в каталоге.</div>';return}
  const total=ids.reduce((s,id)=>s+P.find(p=>p.id===id).p*S.cart[id],0);
  $('#cart').innerHTML=`<div class="list">${ids.map(id=>{const x=P.find(p=>p.id===id);return `<div class="item"><div class="thumb" style="${grad(x.g)}">${ic(x)}</div>
   <div class="t"><b>${x.n}</b><small>${rub(x.p)}</small></div><div class="step"><button data-m="${id}">−</button><span>${S.cart[id]}</span><button data-p="${id}">+</button></div></div>`}).join('')}</div>
   <div class="sum"><span>Итого</span><span>${rub(total)}</span></div><button class="btn" id="co">Оформить заказ</button>`;
  $$('[data-m]').forEach(b=>b.onclick=()=>{add(+b.dataset.m,-1);hap()});
  $$('[data-p]').forEach(b=>b.onclick=()=>{add(+b.dataset.p,1);hap()});
  $('#co').onclick=()=>{if(!S.user){toast('Сначала войдите в профиль');authSheet(true);return}
    checkout(total)}}

function authSheet(fromCart){const u=S.user||{};
  openSheet(`<h2>${S.user?'Изменить данные':'Регистрация'}</h2><p>Укажите контакты для доставки заказов.</p>
  <label class="field"><input id="fn" placeholder="Имя" value="${u.name||''}"></label>
  <label class="field"><input id="fp" type="tel" placeholder="Телефон" value="${u.phone||''}"></label>
  <label class="field"><input id="fe" type="email" placeholder="Эл. почта" value="${u.email||''}"></label>
  <button class="btn" id="fs" style="margin-top:6px">${S.user?'Сохранить':'Зарегистрироваться'}</button>`);
  $('#fs').onclick=()=>{const n=$('#fn'),p=$('#fp'),e=$('#fe');
    const ok=[[n,n.value.trim().length>1],[p,/^[+\d][\d\s()-]{6,}$/.test(p.value.trim())],[e,/^\S+@\S+\.\S+$/.test(e.value.trim())]];
    ok.forEach(([i,v])=>i.classList.toggle('err',!v));
    if(ok.some(x=>!x[1])){hap('heavy');toast('Проверьте поля');return}
    S.user={name:n.value.trim(),phone:p.value.trim(),email:e.value.trim()};save();closeSheet();hap('medium');toast('Готово ✓');if(tab==='profile')renderProfile()}}

function renderProfile(){const u=S.user;
  if(!u){const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    $('#profile').innerHTML=`<div class="center"><div class="ava">👤</div><b style="font-size:20px">${tu?tu.first_name:'Гость'}</b><br><small>Зарегистрируйтесь, чтобы оформлять заказы и видеть их историю</small></div>
    <button class="btn" id="rg">Зарегистрироваться</button>`;$('#rg').onclick=()=>authSheet();return}
  $('#profile').innerHTML=`<div class="center"><div class="ava">${u.name[0].toUpperCase()}</div><b style="font-size:20px">${u.name}</b><br><small>${u.email}</small></div>
  <div class="h2">Данные</div><div class="list"><div class="kv"><span>Телефон</span>${u.phone}</div><div class="kv"><span>Избранное</span>${S.fav.length}</div><div class="kv"><span>Заказов</span>${S.orders.length}</div></div>
  <div class="h2">История заказов</div>

 const pv=()=>{$('#pv').innerHTML=ic({img,e:$('#ee').value||'📦'})};
 $('#pbt').onclick=()=>$('#pf').click();$('#prm').onclick=()=>{img='';ch=true;pv();hap()};$('#ee').oninput=pv;
 $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=await shrink(f);if(n){img=n;ch=true;pv();hap()}};
 $('#ek').onclick=async e=>{const v=k=>$('#'+k).value.trim();const chk=[['en',v('en').length>1],['ec',v('ec').length>1],['ep',+v('ep')>0]];
  chk.forEach(([k,ok])=>$('#'+k).classList.toggle('err',!ok));if(chk.some(c=>!c[1])){hap('heavy');return}
  const b=e.currentTarget;b.disabled=true;b.textContent='Сохраняем…';
  const p={id:id||0,name:v('en'),category:v('ec'),price:+v('ep'),stock:Math.max(0,Math.floor(+v('es')||0)),emoji:v('ee')||'📦',description:v('ed2')};if(ch)p.img=img;
  const j=await post('a_save',{p});b.disabled=false;b.textContent='Сохранить';
  if(!j.ok){hap('heavy');toast(j._s===401||j._s===403?'Откройте магазин через Telegram':'Не удалось сохранить');return}
  closeSheet();hap('medium');toast('Сохранено ✓');loadCatalog()};
 if(id)$('#ex').onclick=async e=>{const b=e.currentTarget;if(!b.dataset.c){b.dataset.c=1;b.textContent='Нажмите ещё раз, чтобы удалить';hap();return}
  await post('a_delete',{id});delete S.cart[id];S.fav=S.fav.filter(f=>f!==id);save();closeSheet();hap('heavy');toast('Товар удалён');loadCatalog()}}

loadCatalog();loadMe();
</script>
</body>
</html>
